<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MarginMind | AI Assistant</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

</head>


<body>

<header>

    <h1>MarginMind</h1>

    <p>
        Your AI Merchant Growth Assistant
    </p>

</header>


<nav class="top-nav">

    <a href="/dashboard">
        Dashboard
    </a>

    <a href="/insights-page">
        Insights
    </a>

    <a href="/recommendations-page">
        Recommendations
    </a>

    <a href="/chatbot">
        AI Assistant
    </a>

    <a href="/audit-page">
        Audit Logs
    </a>

</nav>


<main>

    <section>

        <h2>
            🧠 MarginMind AI Assistant
        </h2>


        <div class="chatbox">

            <div
                id="chatMessages"
                class="chat-messages"
            >

                <div
                    class="bot-message chat-message"
                >

                    <b>MarginMind:</b>

                    <div>
                        Hello! Ask me anything
                        about your business.
                    </div>

                </div>

            </div>


            <form
                id="chatForm"
                class="chat-input"
            >

                <input
                    type="text"
                    id="chatInput"
                    placeholder="Ask about your business..."
                    autocomplete="off"
                    maxlength="10000"
                    required
                >


                <button
                    id="sendChat"
                    type="submit"
                >
                    Send
                </button>

            </form>

        </div>

    </section>

</main>


<script src="/static/script.js"></script>

</body>
</html>
